<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ドパラッシュ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
  :root{
    --bg:#0B0A1E; --surface:#1B1440; --surface2:#2A1B5C;
    --pink:#FF2E88; --cyan:#2EF2FF; --yellow:#F5FF3D; --gold:#FFB800; --white:#FFFFFF; --muted:#8F86C4;
    --disp:'Bungee','M PLUS Rounded 1c',system-ui,sans-serif;
    --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
    --fspeed:.25s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--white);font-family:var(--body);font-weight:700;
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;
  }
  #bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #shake{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));will-change:transform}
  body.fever{animation:feverbg var(--fspeed) steps(2) infinite}
  @keyframes feverbg{0%{background:#2b0033}50%{background:#001f3d}100%{background:#2b0033}}

  header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .stat{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .stat .lab{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .stat .val{font-family:var(--disp);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
  .stat.right{align-items:flex-end}
  .stat.mid{align-items:center}
  #time.hot{color:var(--pink)}

  main{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;min-height:0}
  #score{font-family:var(--disp);font-size:clamp(48px,15vw,92px);line-height:1.15;color:var(--yellow);text-shadow:0 0 18px rgba(245,255,61,.55),4px 4px 0 var(--pink);font-variant-numeric:tabular-nums;transition:transform .08s;max-width:100%;white-space:nowrap;padding:0 10px}
  #score.pop{transform:scale(1.12)}
  #flv{font-family:var(--disp);font-size:clamp(18px,5.5vw,26px);color:#fff;min-height:1.2em;text-align:center;letter-spacing:.04em}
  #flv .lv{color:var(--yellow);text-shadow:0 0 14px var(--pink)}
  #combo{font-family:var(--disp);font-size:clamp(20px,6vw,30px);color:var(--cyan);min-height:1.2em;text-shadow:0 0 12px rgba(46,242,255,.6);text-align:center}
  #combo small{font-family:var(--body);font-size:.55em;letter-spacing:.1em}
  #mult{font-size:15px;color:var(--pink);letter-spacing:.06em;min-height:1.2em}

  #gauge{width:min(80%,360px);height:12px;background:var(--surface);border-radius:999px;overflow:hidden;border:2px solid var(--surface2)}
  #gfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yellow));transition:width .06s linear}
  body.fever #gfill{background:linear-gradient(90deg,#ff0,#f0f,#0ff,#ff0);background-size:300% 100%;animation:rb .4s linear infinite}
  @keyframes rb{to{background-position:300% 0}}

  #btn{
    width:min(62vw,240px);height:min(62vw,240px);border-radius:50%;border:none;cursor:pointer;touch-action:none;
    background:radial-gradient(circle at 35% 30%,#ff7ab5,var(--pink) 55%,#a80f52);
    box-shadow:0 14px 0 #7a0a3c,0 0 40px rgba(255,46,136,.6);
    color:#fff;font-family:var(--disp);font-size:clamp(28px,9vw,44px);letter-spacing:.02em;
    transform:translateY(0);transition:transform .12s,box-shadow .05s,left .25s,top .25s;position:relative;will-change:transform;
  }
  #btn:active,#btn.down{transform:translateY(10px);box-shadow:0 4px 0 #7a0a3c,0 0 60px rgba(255,46,136,.9)}
  #btn:focus-visible{outline:4px solid var(--cyan);outline-offset:6px}
  body.fever #btn{background:radial-gradient(circle at 35% 30%,#fff9a8,var(--yellow) 50%,#c9a500);box-shadow:0 14px 0 #7a6a00,0 0 60px rgba(245,255,61,.8);color:#1a1200}
  body.gold #btn{background:radial-gradient(circle at 35% 30%,#fff5c2,var(--gold) 50%,#8a5a00);box-shadow:0 14px 0 #5a3a00,0 0 60px rgba(255,184,0,.9);color:#2a1a00}
  body.big #btn{transform:scale(1.35)}
  body.big #btn:active,body.big #btn.down{transform:scale(1.35) translateY(8px)}
  body.tiny #btn{transform:scale(.55)}
  body.tiny #btn:active,body.tiny #btn.down{transform:scale(.55) translateY(10px)}
  #hint{color:var(--muted);font-size:14px;text-align:center;min-height:1.4em}

  footer{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.06em;gap:8px}
  #shopbtn{border:none;border-radius:999px;padding:10px 18px;background:var(--surface2);color:var(--cyan);font-family:var(--body);font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #120c33;white-space:nowrap}
  #shopbtn:active{transform:translateY(3px);box-shadow:none}
  #shopbtn.can{background:var(--cyan);color:#001;animation:evpulse .5s steps(2) infinite}

  /* floating text */
  .fl{position:fixed;z-index:3;pointer-events:none;font-family:var(--disp);font-weight:400;left:0;top:0;will-change:transform,opacity;
    --dx:0px;--dy:-120px;--r0:0deg;--r1:0deg;
    transform:translate(-50%,-50%) rotate(var(--r0)) scale(.6);animation:fl .75s cubic-bezier(.15,.8,.3,1) forwards;text-shadow:2px 2px 0 #000}
  @keyframes fl{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r0)) scale(.5)}
    25%{transform:translate(calc(-50% + var(--dx)*.35),calc(-50% + var(--dy)*.35)) rotate(calc(var(--r0)*.5)) scale(1.35)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r1)) scale(1)}
  }
  .shout{position:fixed;z-index:4;left:50%;top:26%;pointer-events:none;font-family:var(--body);font-weight:900;font-size:clamp(34px,11vw,64px);color:var(--yellow);-webkit-text-stroke:2px #000;text-shadow:5px 5px 0 var(--pink);white-space:nowrap;will-change:transform,opacity;
    --fx:0px;--fy:-500px;--a:-6deg;--spin:0deg;
    transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) rotate(calc(var(--a) + var(--spin))) scale(2.5);animation:shout .9s cubic-bezier(.2,1.4,.4,1) forwards}
  .shout.crit{color:#fff;text-shadow:5px 5px 0 var(--cyan)}
  .shout.ev{color:var(--cyan);text-shadow:5px 5px 0 #000;font-size:clamp(26px,8vw,48px)}
  @keyframes shout{
    0%{opacity:0;transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) rotate(calc(var(--a) + var(--spin))) scale(2.5)}
    30%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) scale(1.1)}
    45%{transform:translate(-50%,-50%) rotate(var(--a)) scale(1)}
    80%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) scale(1)}
    100%{opacity:0;transform:translate(calc(-50% - var(--fx)*.3),calc(-50% - var(--fy)*.3)) rotate(calc(var(--a) - var(--spin)*.4)) scale(.8)}
  }
  #flash{position:fixed;inset:0;z-index:2;background:#fff;opacity:0;pointer-events:none}
  #evbar{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:5;background:var(--cyan);color:#001;font-weight:900;font-size:14px;letter-spacing:.06em;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #0a6a73;animation:evpulse .3s steps(2) infinite}
  #evbar[hidden]{display:none}
  @keyframes evpulse{50%{background:var(--yellow)}}

  /* overlays */
  .ov{position:fixed;inset:0;z-index:10;background:rgba(11,10,30,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .ov[hidden]{display:none}
  .card{width:100%;max-width:420px;background:var(--surface);border:3px solid var(--pink);border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 50px rgba(255,46,136,.4);margin:auto}
  .card h2{margin:0;font-family:var(--disp);font-size:20px;color:var(--cyan);letter-spacing:.04em}
  #rank{font-family:var(--disp);font-size:110px;line-height:1;color:var(--yellow);text-shadow:6px 6px 0 var(--pink);animation:rankin .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes rankin{from{transform:scale(4);opacity:0}to{transform:scale(1);opacity:1}}
  #rmsg{font-size:18px;font-weight:900}
  .rrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rrow div{background:var(--bg);border-radius:12px;padding:10px 6px;min-width:0}
  .rrow .lab{font-size:11px;color:var(--muted);letter-spacing:.14em}
  .rrow .val{font-family:var(--disp);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat .val{white-space:nowrap}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .b{border:none;border-radius:999px;padding:13px 22px;font-family:var(--body);font-weight:900;font-size:16px;cursor:pointer}
  .b.p{background:var(--pink);color:#fff;box-shadow:0 6px 0 #7a0a3c}
  .b.s{background:var(--surface2);color:var(--cyan);box-shadow:0 6px 0 #120c33}
  .b.g{background:var(--gold);color:#2a1a00;box-shadow:0 6px 0 #5a3a00}
  .b:active{transform:translateY(4px);box-shadow:none}
  .b:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  #newbest{color:var(--yellow);font-size:14px;letter-spacing:.1em;min-height:1.2em}
  #lvbar{width:100%;height:8px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:6px}
  #lvfill{height:100%;background:var(--cyan);transition:width .4s}
  .lvup{color:var(--cyan);font-weight:900;font-size:15px;letter-spacing:.04em}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}

  /* shop */
  .card.shop{border-color:var(--cyan);box-shadow:0 0 50px rgba(46,242,255,.3);text-align:left;gap:10px}
  .wallet{display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);border-radius:12px;padding:10px 14px}
  .wallet .lab{font-size:11px;color:var(--muted);letter-spacing:.14em}
  .wallet .val{font-family:var(--disp);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
  .up{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
  .up .nm{font-weight:900;font-size:15px}
  .up .nm span{color:var(--cyan);font-family:var(--disp);font-size:13px;margin-left:6px}
  .up .ds{font-size:12px;color:var(--muted);grid-column:1}
  .up .buy{grid-row:1/3;border:none;border-radius:10px;padding:10px 12px;font-family:var(--body);font-weight:900;font-size:13px;background:var(--surface2);color:var(--muted);min-width:96px;cursor:pointer;white-space:nowrap}
  .up .buy.ok{background:var(--gold);color:#2a1a00;box-shadow:0 4px 0 #5a3a00}
  .up .buy.ok:active{transform:translateY(3px);box-shadow:none}
  .up.pre{border:2px dashed var(--pink)}
  .up.pre .buy.ok{background:var(--pink);color:#fff;box-shadow:0 4px 0 #7a0a3c}

  @media (prefers-reduced-motion:reduce){
    body.fever{animation:none;background:#1a0a2e}
    .fl{animation-duration:.4s}
    #rank{animation:none}
    #shopbtn.can,#evbar{animation:none}
  }
</style></head><body>

<canvas id="bgc"></canvas>
<div id="flash"></div>
<div id="evbar" hidden></div>

<div id="shake">
  <header>
    <div class="stat"><span class="lab">Time</span><span class="val" id="time">30.0</span></div>
    <div class="stat mid"><span class="lab">Lv</span><span class="val" id="lv" style="color:var(--cyan)">1</span></div>
    <div class="stat right"><span class="lab">Best</span><span class="val" id="best">0</span></div>
  </header>

  <main>
    <div id="score">0</div>
    <div id="flv"></div>
    <div id="combo"></div>
    <div id="mult"></div>
    <div id="gauge"><div id="gfill"></div></div>
    <button id="btn" type="button">TAP!</button>
    <div id="hint">連打で開始！ 30秒で何点いける？</div>
  </main>

  <footer>
    <span id="basem">基礎 ×1</span>
    <button id="shopbtn" type="button">強化 ▶</button>
  </footer>
</div>

<div id="result" class="ov" hidden>
  <div class="card">
    <h2>TIME UP</h2>
    <div id="rank">S</div>
    <div id="rmsg"></div>
    <div id="newbest"></div>
    <div class="rrow">
      <div><div class="lab">SCORE</div><div class="val" id="rscore">0</div></div>
      <div><div class="lab">MAX COMBO</div><div class="val" id="rcombo">0</div></div>
      <div><div class="lab">MAX FEVER</div><div class="val" id="rfev">-</div></div>
    </div>
    <div>
      <div class="lvup" id="lvmsg"></div>
      <div id="lvbar"><div id="lvfill"></div></div>
      <div class="sub" id="lvnext"></div>
    </div>
    <div class="btnrow">
      <button class="b p" id="retry" type="button">もう一回</button>
      <button class="b g" id="toshop" type="button">強化する</button>
      <button class="b s" id="share" type="button">結果をコピー</button>
    </div>
  </div>
</div>

<div id="shop" class="ov" hidden>
  <div class="card shop">
    <h2 style="text-align:center">強化ショップ</h2>
    <div class="wallet"><span class="lab">持ってるドパ</span><span class="val" id="wallet">0</span></div>
    <div id="ups"></div>
    <div class="btnrow"><button class="b p" id="closeshop" type="button">とじる</button></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ================= 保存データ（成長する部分） =================
  const S = { best:0, total:0, wallet:0, prestige:0, up:{power:0,crit:0,fmax:0,fstep:0,auto:0,time:0,start:0} };
  try{ const j=JSON.parse(localStorage.getItem('doparush_v4')||'null'); if(j){ Object.assign(S,j); S.up=Object.assign({power:0,crit:0,fmax:0,fstep:0,auto:0,time:0,start:0},j.up||{}); } }catch(e){}
  function save(){ try{ localStorage.setItem('doparush_v4',JSON.stringify(S)); }catch(e){} }

  // レベル：累計ポイントで上がる。必要量は 2倍ずつ、基礎倍率は 1.5倍ずつ
  const lvNeed = lv => 1000*Math.pow(2,lv-1);
  function levelOf(t){ let lv=1; while(t>=lvNeed(lv) && lv<200){ t-=lvNeed(lv); lv++; } return {lv, into:t, need:lvNeed(lv)}; }
  const baseMult = lv => Math.pow(1.5, lv-1);
  let level = levelOf(S.total).lv;

  // 強化（上限なし。コストは買うほど増える）
  const UPS = [
    {id:'power', name:'指パワー',      desc:l=>`1タップの土台 +${l}（次：+${l+1}）`,       cost:l=>200*Math.pow(1.6,l)},
    {id:'crit',  name:'クリティカル',   desc:l=>`会心の倍率 ×${5+l}（次：×${6+l}）`,        cost:l=>600*Math.pow(1.7,l)},
    {id:'fmax',  name:'FEVER上限',      desc:l=>`FEVER最大 Lv.${12+l}（次：Lv.${13+l}）`,   cost:l=>1500*Math.pow(1.8,l)},
    {id:'fstep', name:'FEVER加速',      desc:l=>`次のLvまで ${Math.max(6,30-2*l)}連打`+(30-2*l<=6?'（MAX）':`（次：${Math.max(6,28-2*l)}）`), cost:l=>1000*Math.pow(1.9,l), max:12},
    {id:'auto',  name:'オート連打',     desc:l=>`勝手に 毎秒${l}回 タップ（次：${l+1}回）`,  cost:l=>800*Math.pow(1.75,l)},
    {id:'time',  name:'タイム延長',     desc:l=>`1回 ${30+l}秒（次：${31+l}秒）`,             cost:l=>2000*Math.pow(2.2,l)},
    {id:'start', name:'スタートダッシュ', desc:l=>`最初から ${l*5}コンボ持ち（次：${(l+1)*5}）`, cost:l=>500*Math.pow(1.7,l)},
  ];
  const prestigeMult = () => Math.pow(2, S.prestige);
  const prestigeReq  = () => 10 + S.prestige*3;   // 転生に必要な Lv
  const ROUND   = () => 30 + S.up.time;
  const FEVER_STEP = () => Math.max(6, 30 - 2*S.up.fstep);
  const FEVER_MAX  = () => 12 + S.up.fmax;
  const CRIT_MULT  = () => 5 + S.up.crit;
  const COMBO_GAP = 650, FEVER_AT = 50, FEVER_MS = 6000;

  // 表示用：万・億・兆・京・垓
  function fmt(n){
    n=Math.round(n); if(!isFinite(n)) return '∞';
    if(n>=1e52){ const e=Math.floor(Math.log10(n)); return (n/Math.pow(10,e)).toFixed(1)+'e'+e; }   // それ以上は 1.2e60 表記
    const u=[['極',1e48],['載',1e44],['正',1e40],['澗',1e36],['溝',1e32],['穣',1e28],['じょ',1e24],['垓',1e20],['京',1e16],['兆',1e12],['億',1e8],['万',1e4]];
    for(const [s,v] of u) if(n>=v){ const x=n/v; return (x>=100?Math.round(x):x.toFixed(1).replace(/\.0$/,''))+s; }
    return String(n);
  }
  function fmtMult(m){ return m>=100?fmt(m):(+m.toFixed(1)).toString(); }
  // 数字を入れて、枠からはみ出すなら文字を小さくする（見切れ防止）
  function setNum(id, txt){
    const el=$(id); el.textContent=txt; el.style.fontSize='';
    const box=el.parentElement.clientWidth - (id==='score'?0:4);
    const w=el.scrollWidth;
    if(w>box && box>0){ const base=parseFloat(getComputedStyle(el).fontSize); el.style.fontSize=Math.max(11, Math.floor(base*box/w*0.96))+'px'; }
  }
  function showLevel(){ $('lv').textContent=level; $('basem').textContent=`基礎 ×${fmtMult(baseMult(level)*prestigeMult())}${S.prestige?` ★${S.prestige}`:''}`; }
  function showWallet(){ setNum('wallet',fmt(S.wallet)); const can=UPS.some(u=>S.wallet>=u.cost(S.up[u.id]) && !(u.max&&S.up[u.id]>=u.max)); $('shopbtn').classList.toggle('can',can); $('shopbtn').textContent=`強化 ▶ ${fmt(S.wallet)}`; }
  setNum('best',fmt(S.best)); showLevel(); showWallet();

  // ================= 端末に合わせた軽さ調整 =================
  const lowEnd = (navigator.hardwareConcurrency||4)<=4 || (navigator.deviceMemory||4)<=2;
  const Q = { maxParts: lowEnd?120:400, maxFl: lowEnd?14:30, partScale: lowEnd?0.5:1, dpr: Math.min(devicePixelRatio||1, lowEnd?1:2) };
  let slowFrames=0;

  // ---- sound（鳴らしすぎ防止つき）----
  let ac=null, lastBeep=0;
  function beep(freq, type='square', dur=0.07, vol=0.18){
    const now=performance.now(); if(now-lastBeep<28 && vol<0.2) return; lastBeep=now;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq*1.5, ac.currentTime+dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }

  // ---- particles（配列使い回し・上限つき）----
  const cv=$('bgc'), ctx=cv.getContext('2d',{alpha:true}); const parts=[];
  function resize(){cv.width=innerWidth*Q.dpr; cv.height=innerHeight*Q.dpr; ctx.setTransform(Q.dpr,0,0,Q.dpr,0,0);}
  addEventListener('resize',resize); resize();
  const COLORS=['#FF2E88','#2EF2FF','#F5FF3D','#FFFFFF'];
  function burst(x,y,n,power){
    n=Math.round(n*Q.partScale); if(reduce) n=Math.min(n,8);
    for(let i=0;i<n;i++){
      if(parts.length>=Q.maxParts) parts.shift();
      const a=Math.random()*Math.PI*2, s=power*(0.4+Math.random());
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,size:3+Math.random()*5,c:COLORS[Math.random()*COLORS.length|0],rot:Math.random()*6});
    }
  }
  let lastF=performance.now();
  function frame(t){
    const raw=t-lastF, dt=Math.min(raw/16.7,3); lastF=t;
    // 重い端末なら自動で軽量モードへ
    if(raw>34){ if(++slowFrames>20 && Q.partScale>0.3){ Q.partScale=0.3; Q.maxParts=80; Q.maxFl=10; slowFrames=0; } } else slowFrames=Math.max(0,slowFrames-1);
    if(parts.length){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      let w=0;
      for(let i=0;i<parts.length;i++){
        const p=parts[i];
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.35*dt; p.life-=0.022*dt; p.rot+=0.2*dt;
        if(p.life<=0) continue;
        parts[w++]=p;
        ctx.globalAlpha=p.life; ctx.fillStyle=p.c;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6); ctx.restore();
      }
      parts.length=w; ctx.globalAlpha=1;
    } else if(needClear){ ctx.clearRect(0,0,innerWidth,innerHeight); needClear=false; }
    if(parts.length) needClear=true;
    tick(t);
    requestAnimationFrame(frame);
  }
  let needClear=false;
  requestAnimationFrame(frame);

  // ---- 飛ぶ文字（上限つき）----
  let flCount=0;
  function floatText(x,y,txt,color,size){
    if(flCount>=Q.maxFl) return;
    const el=document.createElement('div'); el.className='fl'; el.textContent=txt;
    const ang=rnd(-Math.PI,Math.PI), dist=rnd(90,190);
    el.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    el.style.setProperty('--dy',(Math.sin(ang)*dist-50)+'px');
    el.style.setProperty('--r0',rnd(-70,70)+'deg');
    el.style.setProperty('--r1',rnd(-140,140)+'deg');
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.color=color; el.style.fontSize=size+'px';
    document.body.appendChild(el); flCount++;
    setTimeout(()=>{el.remove(); flCount--;},800);
  }
  function shout(txt,kind){
    const el=document.createElement('div'); el.className='shout'+(kind?' '+kind:''); el.textContent=txt;
    const side=Math.random()*4|0, far=Math.max(innerWidth,innerHeight);
    el.style.setProperty('--fx',[0,far,0,-far][side]+'px'); el.style.setProperty('--fy',[-far,0,far,0][side]+'px');
    el.style.setProperty('--a',rnd(-22,22)+'deg'); el.style.setProperty('--spin',rnd(-540,540)+'deg');
    el.style.top=(kind==='ev'?60:rnd(18,36))+'%';
    document.body.appendChild(el); setTimeout(()=>el.remove(),950);
  }
  let shakeUntil=0, shakePx=0; const shakeEl=$('shake');
  function shake(px){ if(reduce) return; shakePx=Math.max(shakePx,px); shakeUntil=performance.now()+180; }
  function flash(op){ const f=$('flash'); f.style.transition='none'; f.style.opacity=op; requestAnimationFrame(()=>{f.style.transition='opacity .25s'; f.style.opacity=0;}); }

  const CRIT_WORDS=['CRITICAL!!','ドカン!!','会心!!','ズドン!!','バキッ!!','当たり!!'];
  const PRAISE_POOL={10:['いいね！','おっ？','ノってきた','いいぞ！'],20:['すごい！','キレてる！','はやい！','おお！？'],30:['やばい！','ヤバすぎ','手が見えん','天才か？'],40:['とまらん！','鬼連打','化け物','狂気'],50:['FEVER!!'],75:['神！！','限界突破','神の指'],100:['伝説！！！','100!!!','歴史に残る'],150:['人間やめてる','指がバグってる','機械かよ'],200:['宇宙！！！','次元が違う','もう帰っていいよ'],300:['300!!!','狂ってる'],500:['500!!!!','伝説を超えた']};
  const ODD_WORDS=['えらい！','天才！','最高！','うおお','ｷﾀｷﾀ','ﾃﾞｭｸｼ','ﾊﾟｧｧ','いける','ｲｲﾈ','ﾊﾞｸﾊﾂ'];

  // ================= 突発イベント =================
  let ev=null, evEnd=0, nextEv=0;
  const EVENTS=[
    {id:'gold',label:'黄金タイム ×2',ms:4500,say:'黄金タイム！'},
    {id:'big',label:'デカボタン',ms:4000,say:'でっか！'},
    {id:'tiny',label:'ミニボタン ×3',ms:4000,say:'ちっさ！'},
    {id:'run',label:'逃げるボタン ×3',ms:4500,say:'逃げた！'},
    {id:'rain',label:'ボーナスラッシュ +50',ms:3500,say:'ボーナス！'},
  ];
  const btn=$('btn');
  function startEvent(now){
    ev=pick(EVENTS); evEnd=now+ev.ms; document.body.classList.add(ev.id);
    $('evbar').textContent=ev.label; $('evbar').hidden=false;
    shout(ev.say,'ev'); flash(0.35); beep(660,'triangle',0.3,0.22); setTimeout(()=>beep(990,'triangle',0.3,0.22),120);
    if(ev.id==='run') moveBtn();
  }
  function endEvent(){ if(!ev) return; document.body.classList.remove(ev.id); $('evbar').hidden=true; btn.style.left=''; btn.style.top=''; btn.style.position=''; ev=null; }
  function moveBtn(){ const r=btn.getBoundingClientRect(); btn.style.position='fixed'; btn.style.left=rnd(10,innerWidth-r.width-10)+'px'; btn.style.top=rnd(70,innerHeight-r.height-60)+'px'; }
  function evMult(){ return ev?.id==='gold'?2 : (ev?.id==='tiny'||ev?.id==='run')?3 : 1; }

  // ================= ゲーム本体 =================
  let score=0, combo=0, maxCombo=0, taps=0, lastTap=0, running=false, endAt=0;
  let fever=false, feverEnd=0, feverLv=0, feverTaps=0, maxFever=0, gaugeTarget=0, autoAcc=0;
  function mult(){ return 1+Math.floor(combo/10); }
  const perTapBase = () => baseMult(level)*prestigeMult()*(1+S.up.power);

  function onTap(x,y,auto){
    const now=performance.now();
    if(!running){ if(auto) return; start(now); }
    if(now>endAt) return;
    if(now-lastTap>COMBO_GAP) combo=Math.min(combo, S.up.start*5);
    lastTap=now; combo++; taps++; maxCombo=Math.max(maxCombo,combo);

    const crit=Math.random()<0.12;
    const fm = fever ? Math.pow(3,feverLv) : 1;
    let gain=Math.round(perTapBase()*mult()*(crit?CRIT_MULT():1)*fm*evMult()) + (ev?.id==='rain'?Math.round(50*perTapBase()):0);
    score+=gain;
    if(ev?.id==='run' && !auto) moveBtn();

    // feedback（オート連打は控えめ）
    const sc=$('score'); setNum('score',fmt(score));
    if(!auto){ sc.classList.add('pop'); setTimeout(()=>sc.classList.remove('pop'),80); }
    floatText(x, y, '+'+fmt(gain), crit?'#fff':(fever?'#F5FF3D':(ev?'#FFB800':(auto?'#8F86C4':'#2EF2FF'))), auto?18:(crit?46:(ev?32:26)+Math.min(feverLv*3,18)));
    if(!auto){
      if(Math.random()<0.15) floatText(x, y, pick(ODD_WORDS), '#FF2E88', 22);
      burst(x,y, crit?40:(fever?18+feverLv*4:8), crit?12:6+feverLv);
      beep(220+Math.min(combo,80)*14+feverLv*60, crit?'sawtooth':'square', crit?0.16:0.07, crit?0.25:0.16);
      shake(crit?18:4+feverLv);
      if(crit){ shout(pick(CRIT_WORDS),'crit'); flash(0.5); }
      else if(PRAISE_POOL[combo]){ shout(pick(PRAISE_POOL[combo])); beep(880,'triangle',0.2,0.2); }
    }

    // FEVER：入ったあとも連打で Lv が上がる（×3ずつ）
    if(combo>=FEVER_AT && !fever){
      fever=true; feverLv=1; feverTaps=0; feverEnd=now+FEVER_MS;
      document.body.classList.add('fever'); flash(0.8); shake(24); burst(innerWidth/2,innerHeight/2,120,14); beep(1320,'sawtooth',0.4,0.25);
    } else if(fever){
      feverTaps++;
      if(feverTaps>=FEVER_STEP() && feverLv<FEVER_MAX()){
        feverLv++; feverTaps=0; feverEnd=now+FEVER_MS;
        shout(`FEVER Lv.${feverLv}!!`,'crit'); flash(0.9); shake(20+feverLv*3);
        burst(innerWidth/2,innerHeight/2,100+feverLv*20,12+feverLv*2);
        beep(1320+feverLv*120,'sawtooth',0.45,0.28); setTimeout(()=>beep(1980+feverLv*120,'sawtooth',0.4,0.25),110);
      }
    }
    if(fever){ feverEnd=Math.max(feverEnd, now+1500); maxFever=Math.max(maxFever,feverLv); }
    document.documentElement.style.setProperty('--fspeed', Math.max(0.06, 0.25-feverLv*0.02)+'s');

    $('combo').innerHTML = combo>1 ? combo+'<small> COMBO</small>' : '';
    $('flv').innerHTML = fever ? `FEVER <span class="lv">Lv.${feverLv}</span> ×${fmtMult(fm)}` : '';
    $('mult').textContent = mult()>1 ? `コンボ ×${mult()}` : '';
    gaugeTarget = fever ? feverTaps/FEVER_STEP()*100 : Math.min(combo/FEVER_AT*100,100);
  }
  function start(now){
    running=true; score=0; combo=S.up.start*5; maxCombo=combo; taps=0; fever=false; feverLv=0; feverTaps=0; maxFever=0; autoAcc=0;
    endAt=now+ROUND()*1000; nextEv=now+rnd(4000,7000); endEvent();
    $('hint').textContent='止まったらコンボが切れる！'; $('score').textContent='0'; $('flv').textContent=''; document.body.classList.remove('fever');
  }
  function tick(now){
    // 揺れ（setInterval を使わず 1本の描画ループで）
    if(now<shakeUntil){ shakeEl.style.transform=`translate(${(Math.random()-.5)*shakePx}px,${(Math.random()-.5)*shakePx}px)`; }
    else if(shakePx){ shakePx=0; shakeEl.style.transform=''; }

    if(running){
      const left=Math.max(0,(endAt-now)/1000);
      if(ev && now>evEnd){ endEvent(); nextEv=now+rnd(3500,6500); }
      if(!ev && now>nextEv && left>4){ startEvent(now); }
      // オート連打
      if(S.up.auto>0){
        autoAcc+=(now-lastTickT)/1000*S.up.auto;
        let n=0; while(autoAcc>=1 && n<5){ autoAcc-=1; n++; const r=btn.getBoundingClientRect(); onTap(r.left+rnd(20,r.width-20), r.top+rnd(20,r.height-20), true); }
      }
      const t=$('time'); t.textContent=left.toFixed(1); t.classList.toggle('hot',left<5);
      if(now-lastTap>COMBO_GAP && combo>S.up.start*5 && !fever){ combo=S.up.start*5; $('combo').textContent=combo>1?combo+' COMBO':''; $('mult').textContent=''; gaugeTarget=0; }
      if(fever && now>feverEnd){ fever=false; feverLv=0; feverTaps=0; document.body.classList.remove('fever'); $('flv').textContent=''; $('mult').textContent=''; combo=S.up.start*5; $('combo').textContent=''; gaugeTarget=0; }
      if(!fever && combo>0){ gaugeTarget=Math.max(0,(1-(now-lastTap)/COMBO_GAP))*Math.min(combo/FEVER_AT*100,100); }
      if(left<=0) finish();
    }
    lastTickT=now;
    $('gfill').style.width=gaugeTarget+'%';
  }
  let lastTickT=performance.now();

  function finish(){
    running=false; fever=false; document.body.classList.remove('fever'); endEvent();
    const b=perTapBase();
    const r = score>=5000*b?'S':score>=3000*b?'A':score>=1600*b?'B':score>=600*b?'C':'D';
    const msg={S:'ドーパミン大爆発',A:'指が神になってる',B:'いい感じにキマってる',C:'まだ脳が起きてない',D:'ウォーミングアップ？'}[r];
    $('rank').textContent=r; $('rmsg').textContent=msg;
    $('result').hidden=false; setNum('rscore',fmt(score)); setNum('rcombo',String(maxCombo)); setNum('rfev',maxFever?('Lv.'+maxFever):'-');
    let nb=false; if(score>S.best){ S.best=score; nb=true; setNum('best',fmt(S.best)); }
    $('newbest').textContent = nb ? '★ NEW RECORD ★' : '';
    if(nb){ burst(innerWidth/2,innerHeight/3,150,16); beep(1760,'triangle',0.5,0.25); }
    // 成長：累計→Lv、ドパ→ショップ
    const oldLv=level; S.total+=score; S.wallet+=score; save();
    const L=levelOf(S.total); level=L.lv; showLevel(); showWallet();
    $('lvfill').style.width=Math.min(100,L.into/L.need*100)+'%';
    $('lvnext').textContent=`次の Lv まで あと ${fmt(L.need-L.into)} pt（累計 ${fmt(S.total)} pt）　+${fmt(score)} ドパ 獲得`;
    if(level>oldLv){ $('lvmsg').textContent=`LEVEL UP! Lv.${oldLv} → Lv.${level}　基礎倍率 ×${fmtMult(baseMult(level)*prestigeMult())}`; setTimeout(()=>{ shout(`Lv.${level}!!`); beep(1500,'triangle',0.4,0.25); },300); }
    else $('lvmsg').textContent=`Lv.${level}　基礎倍率 ×${fmtMult(baseMult(level)*prestigeMult())}`;
    $('result').hidden=false; $('retry').focus();
  }

  // ================= ショップ =================
  function renderShop(){
    const box=$('ups'); box.innerHTML='';
    for(const u of UPS){
      const l=S.up[u.id], maxed=u.max&&l>=u.max, cost=u.cost(l), ok=!maxed&&S.wallet>=cost;
      const d=document.createElement('div'); d.className='up';
      d.innerHTML=`<div class="nm">${u.name}<span>Lv.${l}</span></div><button class="buy${ok?' ok':''}" type="button" ${ok?'':'disabled'}>${maxed?'MAX':fmt(cost)+' ドパ'}</button><div class="ds">${u.desc(l)}</div>`;
      d.querySelector('.buy').addEventListener('click',()=>{ if(!ok) return; S.wallet-=cost; S.up[u.id]++; save(); beep(1200,'triangle',0.15,0.2); burst(innerWidth/2,innerHeight/2,40,8); renderShop(); showWallet(); showLevel(); });
      box.appendChild(d);
    }
    // 転生
    const can=level>=prestigeReq();
    const p=document.createElement('div'); p.className='up pre';
    p.innerHTML=`<div class="nm">転生 ★${S.prestige}<span>永久 ×${fmt(prestigeMult())}</span></div><button class="buy${can?' ok':''}" type="button" ${can?'':'disabled'}>${can?'転生する':'Lv.'+prestigeReq()+'で解放'}</button><div class="ds">Lv・強化・ドパを全部リセットする代わりに、ずっと全部 ×2（次：×${fmt(prestigeMult()*2)}）。何回でもできる</div>`;
    p.querySelector('.buy').addEventListener('click',()=>{
      if(!can) return;
      if(!confirm(`転生します。Lv.${level} と強化が全部リセットされ、代わりに永久倍率が ×${fmt(prestigeMult()*2)} になります。いい？`)) return;
      S.prestige++; S.total=0; S.wallet=0; for(const k in S.up) S.up[k]=0; level=1; save();
      shout('転生!!','crit'); flash(1); burst(innerWidth/2,innerHeight/2,200,16); beep(1760,'sawtooth',0.6,0.3);
      renderShop(); showWallet(); showLevel();
    });
    box.appendChild(p);
    setNum('wallet',fmt(S.wallet));
  }
  function openShop(){ $('shop').hidden=false; renderShop(); }
  $('shopbtn').addEventListener('click',()=>{ if(running) return; openShop(); });
  $('toshop').addEventListener('click',()=>{ $('result').hidden=true; openShop(); });
  $('closeshop').addEventListener('click',()=>{ $('shop').hidden=true; resetView(); });

  // ================= 入力（pointer events で全端末共通）=================
  function handle(e){
    e.preventDefault();
    onTap(e.clientX, e.clientY, false);
    btn.classList.add('down'); setTimeout(()=>btn.classList.remove('down'),60);
  }
  btn.addEventListener('pointerdown',handle);
  btn.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});   // 長押しメニューやダブルタップ拡大を止める
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter')&&!e.repeat&&$('result').hidden&&$('shop').hidden){ const r=btn.getBoundingClientRect(); onTap(r.left+r.width/2,r.top+r.height/2,false); e.preventDefault(); } });
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && running){ endAt=Math.min(endAt, performance.now()); } });

  function resetView(){ setNum('score','0'); $('combo').textContent=''; $('mult').textContent=''; $('flv').textContent=''; $('time').textContent=ROUND().toFixed(1); $('time').classList.remove('hot'); $('hint').textContent=`連打で開始！ ${ROUND()}秒で何点いける？`; gaugeTarget=0; }
  $('retry').addEventListener('click',()=>{ $('result').hidden=true; resetView(); });
  $('share').addEventListener('click',async()=>{
    const txt=`ドパラッシュ 結果: ${$('rank').textContent}ランク / ${fmt(score)}点 / 最大${maxCombo}コンボ / FEVER Lv.${maxFever} / プレイヤーLv.${level}${S.prestige?' ★'+S.prestige:''} 🔥`;
    try{ await navigator.clipboard.writeText(txt); $('share').textContent='コピーした！'; }catch(e){ $('share').textContent=txt; }
    setTimeout(()=>$('share').textContent='結果をコピー',1500);
  });
  resetView();
})();
</script>
</body></html>
